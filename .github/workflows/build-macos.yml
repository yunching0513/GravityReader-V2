name: Build macOS

# Builds the macOS installer (.dmg) so you can install the app without setting
# up Python, Node and PyInstaller on your Mac. PyInstaller can't cross-compile,
# so each architecture needs a runner of that architecture:
#   macos-14 → Apple silicon (arm64)   macos-13 → Intel (x64)
#
# Apple silicon is built by default. Intel is opt-in because macos-13 runners
# are being retired and this repo can't currently schedule one — a job asking
# for macos-13 sat queued indefinitely with no runner assigned, leaving the
# whole run "in progress" forever. Tick the "intel" input only if you know a
# macos-13 runner is available to you.
#
# To get a build: Actions → "Build macOS" → Run workflow. When it finishes,
# download the artifact for your Mac from the run's Artifacts section. Pushing a
# v* tag builds Apple silicon automatically.
#
# The app is ad-hoc signed, not notarized (that needs a paid Apple Developer
# account), so macOS quarantines it on first open. See desktop/README.md —
# one `xattr` command clears it.
#
# Optional: set a repo secret GOOGLE_API_KEY to bake the key into the build so
# the app's Gemini features work out of the box. Without it the app still
# builds; you just enter a key in the app's settings. (Artifacts are only
# downloadable by repo collaborators — don't attach a key-baked build to a
# public Release.)

on:
  workflow_dispatch:
    inputs:
      intel:
        description: 'Also build for Intel Macs (needs a macos-13 runner — usually unavailable, the job will just sit queued)'
        type: boolean
        default: false
  push:
    tags: ['v*']

jobs:
  # Decide which architectures to build. A tiny Linux job so the expensive macOS
  # runners are only claimed for architectures we can actually schedule.
  targets:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        run: |
          ARM='{"runner":"macos-14","arch":"arm64","label":"Apple-silicon"}'
          INTEL='{"runner":"macos-13","arch":"x64","label":"Intel"}'
          if [ "${{ inputs.intel }}" = "true" ]; then
            echo "include=[$ARM,$INTEL]" >> "$GITHUB_OUTPUT"
          else
            echo "include=[$ARM]" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.include) }}
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.label }} (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy renderer into Electron app
        run: |
          rm -rf desktop/renderer
          cp -R frontend/dist desktop/renderer

      - name: Build backend (PyInstaller)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --noconfirm --clean --name GravityReaderBackend \
            --collect-all google.generativeai \
            --collect-all google.ai.generativelanguage \
            --collect-all google.api_core \
            --collect-all google.auth \
            --collect-all grpc \
            --collect-all grpc_status \
            --collect-all uvicorn \
            --collect-submodules google \
            main.py

      - name: Bundle backend + .env
        env:
          GR_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          rm -f backend/dist/GravityReaderBackend/.env
          if [ -n "$GR_KEY" ]; then
            echo "GOOGLE_API_KEY=$GR_KEY" > backend/dist/GravityReaderBackend/.env
          fi
          rm -rf desktop/backend
          mkdir -p desktop/backend
          cp -R backend/dist/GravityReaderBackend desktop/backend/GravityReaderBackend

      - name: Package (electron-builder --mac)
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: YunsReader-macOS-${{ matrix.arch }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error
